[package]
name = "strum"
# The same as package.json's (the installer takes that one, the runtime stamp this one).
version = "0.1.0"
description = "Strum: guitar amp, songs without the guitarist, chords, tabs and lyrics"
edition = "2021"
publish = false
# What Tauri 2.12 needs.
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
